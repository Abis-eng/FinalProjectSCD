# CI/CD Pipeline — SCD Final Project evaluation requirements
# Checkout → Java setup → Maven build → JUnit tests → Artifact → Docker image

name: E-Clinic CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Maven clean package
        run: mvn -B clean package -DskipTests

      - name: Run JUnit tests
        run: mvn -B test

      - name: Rebuild WAR after tests
        run: mvn -B package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: elcinic-war
          path: target/elcinic.war
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build WAR for Docker
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -t elcinic-web:latest .

      - name: Verify Docker image
        run: docker images elcinic-web:latest
